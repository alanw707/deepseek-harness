<!doctype html>
<!-- THROWAWAY PROTOTYPE — issue #20. Open this file directly in a browser. No data persists. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Delivery Workspace prototype</title>
<style>
  :root { color-scheme: dark; --bg:#0b1020; --panel:#151d31; --line:#2a395c; --muted:#a9b7d0; --ink:#f4f7ff; --accent:#78a6ff; --ok:#50d89a; --warn:#ffbc4d; --danger:#ff7373; }
  * { box-sizing:border-box } body { margin:0; font:14px/1.45 ui-sans-serif,system-ui,sans-serif; background:var(--bg); color:var(--ink) } button { font:inherit; color:inherit; background:#202c49; border:1px solid var(--line); padding:.55rem .7rem; border-radius:.45rem; cursor:pointer } button:hover { border-color:var(--accent) } button.primary { background:#2865d9; border-color:#4c82ee } button.danger { background:#612a39; border-color:#a84962 }
  header { padding:1.25rem max(1.25rem,calc((100vw - 1300px)/2)); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:1rem; align-items:start } h1 { font-size:1.25rem; margin:0 0 .25rem } h2 { font-size:.95rem; margin:0 0 .7rem } p { margin:.35rem 0 } .muted { color:var(--muted) } .badge { display:inline-block; padding:.15rem .45rem; border-radius:1rem; background:#243556; color:#cbd9fb; font-size:.8rem }.badge.warn{background:#553b16;color:#ffe0a1}.badge.ok{background:#124a38;color:#a9f0ce}.badge.danger{background:#592535;color:#ffc1cb}
  main { max-width:1300px; margin:auto; padding:1rem 1.25rem 5rem; display:grid; gap:1rem } .card { background:var(--panel); border:1px solid var(--line); border-radius:.7rem; padding:1rem }.grid { display:grid; grid-template-columns:1.2fr .8fr; gap:1rem }.columns { display:grid; grid-template-columns:repeat(3,1fr); gap:1rem }.item { border-top:1px solid var(--line); padding:.65rem 0 }.item:first-child{border:0;padding-top:0}.actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem}.stage { display:grid; grid-template-columns:12rem 1fr auto; gap:.7rem; padding:.65rem 0; border-top:1px solid var(--line); align-items:center }.stage:first-child{border:0}.stage.active{margin:0 -.5rem;padding:.65rem .5rem;background:#192847;border-radius:.4rem}.stage small{color:var(--muted)}.stage strong{font-size:.9rem}.event { border-left:3px solid var(--line); padding:.4rem .7rem; margin:.55rem 0; color:var(--muted)}.event.current{border-color:var(--accent);color:var(--ink)}.event.warn{border-color:var(--warn)}.event.ok{border-color:var(--ok)}details{border-top:1px solid var(--line);padding:.6rem 0}summary{cursor:pointer;color:#dce6ff}.empty{padding:1rem;background:#11192b;border-radius:.4rem;color:var(--muted)}
  #state { white-space:pre-wrap; overflow:auto; max-height:20rem; font:12px/1.4 ui-monospace,SFMono-Regular,monospace; color:#cbd9fb }.variant-timeline .grid { grid-template-columns:1fr }.variant-timeline .columns { grid-template-columns:1fr 1fr }.variant-timeline .stage { grid-template-columns:9rem 1fr auto }.variant-review .grid { grid-template-columns:.8fr 1.2fr }.variant-review .columns { grid-template-columns:1fr }.variant-review #activity { order:-1 }.switcher{position:fixed;z-index:2;bottom:1rem;left:50%;transform:translateX(-50%);padding:.55rem;border:1px solid var(--line);border-radius:2rem;background:#11192bea;display:flex;gap:.4rem;box-shadow:0 12px 35px #0008}.switcher button[aria-pressed=true]{background:#2865d9;border-color:#78a6ff}@media(max-width:800px){.grid,.columns{grid-template-columns:1fr}.stage{grid-template-columns:1fr}.switcher{width:calc(100% - 2rem);justify-content:center}header{display:block}}
</style>
<header><div><h1>Delivery Workspace — prototype</h1><div class="muted">Question: can every role understand the outcome, act only on owned decisions, and resolve a disagreement without learning agent internals?</div></div><div><span class="badge">R2 pilot</span> <span class="badge warn" id="routeBadge">route approval waiting</span></div></header>
<main id="app"></main>
<div class="switcher" aria-label="Prototype layouts"><button data-variant="overview">Outcome</button><button data-variant="timeline">Route</button><button data-variant="review">Review</button></div>
<script>
  const initial={variant:new URLSearchParams(location.search).get('variant')||'overview', role:'Delivery Owner',stage:'Specification',route:'waiting',conflict:false,activity:['Signal linked: enterprise route policy request','Portfolio selected the R2 pilot','Specification draft created']};
  let s=structuredClone(initial); const roles=['Delivery Owner','Security/Data Approver','Domain Approver','Executor','Release Approver','Auditor'];
  const stages=[['Signal','Customer request: restrict model routes by tenant policy','complete'],['Framing','R2 pilot selected; single self-hosted tenant','complete'],['Specification','Define approved routes, evidence, accessibility, rollback','active'],['Planning','Pinned workflow, skills, checkpoints, recovery','pending'],['Execution','Build + evaluate with route policy enforced','pending'],['Verification','Security/data, accessibility, provenance evidence','pending'],['Release','Independent release authorization','pending'],['Observation','30-day outcome and route audit','pending'],['Learning','Record feedback and successor work','pending']];
  const esc=x=>String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  function render(){ document.body.className='variant-'+s.variant; document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===s.variant)); const app=document.querySelector('#app');
    const owned={"Delivery Owner":"Propose revision or return for clarification.","Security/Data Approver":"Approve, deny, or request safeguards for route/data policy.","Domain Approver":"Accept outcome scope or return the specification.","Executor":"View the pinned plan; start only after authorization.","Release Approver":"Read eligible release evidence; authorize only when complete.","Auditor":"Inspect lineage and approvals without changing delivery."}[s.role];
    const stagesHtml=stages.map(([n,d,status])=>`<div class="stage ${s.stage===n?'active':''}"><div><strong>${n}</strong><br><small>${d}</small></div><span class="badge ${status==='complete'?'ok':s.stage===n?'warn':''}">${s.stage===n?'current':status}</span>${s.stage===n?'<button onclick="advance()">Next gate</button>':''}</div>`).join('');
    const conflict=s.conflict?`<div class="card"><h2><span class="badge danger">Disagreement</span> Provider terms conflict with requested EU-only processing</h2><p>The Delivery Owner requested a global fallback. Security/Data requires an EU-resident equivalent or a safe stop. Neither claim is overwritten.</p><div class="actions"><button class="primary" onclick="resolveConflict('safe stop')">Require EU route / safe stop</button><button onclick="resolveConflict('return')">Return revision with evidence request</button></div><details open><summary>Bounded evidence</summary><p>Route catalog v4 · tenant data class: confidential · provider retention: 30 days · policy rule: EU residency required.</p></details></div>`:'';
    app.innerHTML=`<section class="grid"><div class="card"><h2>Outcome, not agent internals</h2><p><strong>Enable a self-hosted workspace to use only tenant-approved model routes.</strong></p><p class="muted">Success: every protected request selects an approved route or fails closed, with accessible explanation and reconstructable policy provenance.</p><div class="actions"><button onclick="s.conflict=!s.conflict;log(s.conflict?'Security/Data disagreement raised':'Disagreement closed');render()">${s.conflict?'Hide disagreement':'Raise disagreement'}</button><button onclick="log('Evidence link opened');render()">Open evidence graph</button></div></div><div class="card"><h2>Your responsibility</h2><label class="muted">View as <select onchange="s.role=this.value;render()">${roles.map(r=>`<option ${r===s.role?'selected':''}>${r}</option>`).join('')}</select></label><p>${owned}</p><p class="muted">Authority is shown per action. This view does not expose hidden agent/tool state.</p></div></section>${conflict}<section class="card"><h2>Shared route</h2>${stagesHtml}</section><section class="columns"><div class="card" id="activity"><h2>Attributable activity</h2>${s.activity.map((e,i)=>`<div class="event ${i===s.activity.length-1?'current':''}">${esc(e)}</div>`).join('')}</div><div class="card"><h2>Evidence now needed</h2><div class="item"><strong>Specification</strong><br><span class="muted">Allowed route class, EU residency, failure explanation, fallback equivalence.</span></div><div class="item"><strong>Security/Data decision</strong><br><span class="muted">Provider terms and data transfer approval.</span></div><div class="item"><strong>Evaluation</strong><br><span class="muted">Fail-closed, accessibility, provenance, rollback tests.</span></div></div><div class="card"><h2>State surface</h2><div id="state">${esc(JSON.stringify(s,null,2))}</div></div></section>`; }
  function log(x){s.activity.push(x)} function advance(){const i=stages.findIndex(x=>x[0]===s.stage);if(i<stages.length-1){const next=stages[i+1][0];log(`Transition requested: ${s.stage} → ${next}`);s.stage=next;render()}} function resolveConflict(x){s.conflict=false;log(`Conflict resolution recorded: ${x}`);render()}
  document.querySelectorAll('[data-variant]').forEach(b=>b.onclick=()=>{s.variant=b.dataset.variant;history.replaceState(null,'','?variant='+s.variant);render()});render();
</script>
