# Keyless replay patch plus the solo-factory Consumer under test.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

    - id: solo-factory
      name: '@deepseek-ai/dsh-tool-solo-factory'
      config:
        repository: !!js process.cwd()
        worktreeRoot: !!js dshHomePath('factory/worktrees')
        historyFile: !!js dshHomePath('factory/runs.json')
        branchPrefix: factory
        implement: { executable: factory-snapshot-inert, args: [] }
        test: { executable: factory-snapshot-inert, args: [] }
        review: { executable: factory-snapshot-inert, args: [] }
        pullRequest: { executable: factory-snapshot-inert, args: [] }
